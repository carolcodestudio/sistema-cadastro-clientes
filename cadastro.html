<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes | CarolCode Studio</title>
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <span>💻</span> CarolCode
        </div>
        
        <ul class="menu">
            <li><a href="dashboard.html">🏠 Dashboard</a></li>
            <li class="active"><a href="cadastro.html">👥 Cadastro</a></li>
            <li><a href="consulta.html">🔍 Consulta</a></li>
            <li><a href="relatorio.html">📄 Relatórios</a></li>
            <li><a href="login.html">🚪 Sair</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h1>Cadastrar Novo Cliente</h1>
        <p>Preencha os dados do cliente abaixo para registrá-lo no sistema</p>

        <div class="form-container">
            <form id="formCadastro">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Digite o nome do cliente" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="emailCliente">E-mail</label>
                    <input type="email" id="emailCliente" placeholder="exemplo@email.com" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone / WhatsApp</label>
                    <input type="tel" id="telefone" placeholder="(00) 00000-0000" required autocomplete="off">
                </div>

                <button type="submit" class="btn-cadastrar">Salvar Cadastro</button>
            </form>
        </div>
    </div>
   
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="js/script.js"></script>

</body>
</html>
